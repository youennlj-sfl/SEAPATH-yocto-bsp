name: Pull Requests

on:
  pull_request:
    branches:
      - scarthgap
    types:
      - opened
      - synchronize
      - reopened

  # See dispatch explanation in push.yml.
  workflow_dispatch:
    inputs:
      origin_repo_project:
        type: string
        required: true
        description: >-
          Name of the project that triggered this workflow dispatch.
          It should correspond to a project name in the repo manifest
          or be "repo-manifest" itself.
      origin_sha:
        type: string
        required: true
        description: >-
          Value of the GITHUB_SHA variable for the workflow on the
          origin repository.
      origin_pr_name:
        type: string
        required: true
        description: >-
          Name of the PR that originally triggered the workflow.

run-name: "PR ${{ inputs.origin_pr_name || format('{0}#{1}', github.repository, github.event.pull_request.number) }}"

jobs:
  call-build:
    name: Call Build workflow
    uses: ./.github/workflows/_build.yml
    with:
      origin_repo_project: "${{ inputs.origin_repo_project || vars.REPO_PROJECT }}"
      origin_sha: "${{ inputs.origin_sha || github.sha }}"

  call-cve-check:
    name: Call CVE check workflow
    needs: call-build
    uses: ./.github/workflows/_cve-check.yml
    with:
      build-run-id: ${{ github.run_id }}

  set-result:
    name: Set workflow status
    needs: call-cve-check
    runs-on: ["self-hosted", "linux"]
    steps:
      - name: Fail job if CVE detected
        if: "${{ needs.call-cve-check.outputs.cve-detected == 'true' }}"
        run: |
          echo ::error::Vulnerabilities triggered the fail condition for your build.
          exit 1

  # Might be interesting to post a comment to the PR if CVEs have been found?
  # This would require a separate trigger 'workflow_run' to get privileges.
  # https://github.com/marketplace/actions/create-or-update-comment
  # https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
