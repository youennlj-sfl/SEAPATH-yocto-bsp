name: Pull Requests

on:
  # TODO: make the workflow triggerable by all SEAPATH-related repositories
  # using a "repository_dispatch" trigger:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#repository_dispatch
  pull_request:

jobs:
  call-build:
    uses: ./.github/workflows/_build.yml

  call-cve-check:
    needs: call-build
    uses: ./.github/workflows/_cve-check.yml
    with:
      build-run-id: ${{ github.run_id }}

  set-result:
    needs: call-cve-check
    runs-on: ["self-hosted", "linux"]
    steps:
      - name: Check output of cve-check job
        run: |
          if [ "${{ needs.call-cve-check.outputs.cve-detected }}" = true ]; then
            echo Vulnerabilities triggered the fail condition.
            echo See logs from previous job.
            exit 1
          fi
