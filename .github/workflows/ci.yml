name: CI

on:
  # TODO: make the workflow triggerable by all SEAPATH-related repositories
  # using a "repository_dispatch" trigger:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#repository_dispatch
  workflow_dispatch:

env:
  CQFD_FLAVOR: ci

jobs:
  build:
    runs-on: ["self-hosted", "linux", "cqfd", "repo"]
    strategy:
      fail-fast: true # TODO eventually set to false
      max-parallel: 1
      matrix:
        cqfd_flavor: ["host_efi", "guest_efi", "observer_efi", "host_standalone_efi"]
    env:
      REPO_MANIFEST_REPOSITORY: https://github.com/seapath/repo-manifest
      REPO_MANIFEST_REF: HEAD
      REPO_MANIFEST_NAME: default.xml
      WORKSPACE: workspace-bitbake
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}
    steps:
      - name: Create workspace
        working-directory: ${{ github.workspace }}
        run: mkdir -p ${{ env.WORKSPACE }}

      - name: Init repo
        run: |
          repo init -u "$REPO_MANIFEST_REPOSITORY" -b "$REPO_MANIFEST_REF" -m "$REPO_MANIFEST_NAME"
          repo sync

      # TODO checkout specific ref based on the even that triggered the CI

      - name: Init build system
        run: |
          cqfd init
          touch "keys/ansible_public_ssh_key.pub"
          cp seapath.conf.sample seapath.conf

      - name: Cleanup old builds
        run: |
          rm -rf build

      - name: Build ${{ matrix.cqfd_flavor }}
        run: |
          # Since we are in a non-interactive bash, the bashrc file is not
          # read and CQFD environment variables are not used, especially the
          # Yocto cache -related ones... Thus we source the bashrc file.
          source /etc/bash.bashrc
          cqfd -b ${{ matrix.cqfd_flavor }}

      - name: Upload SBOM files
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ matrix.cqfd_flavor }}
          path: |
            ${{ env.WORKSPACE }}/build/tmp/deploy/images/**/*.rootfs.json
            ${{ env.WORKSPACE }}/build/tmp/deploy/images/**/*.rootfs.spdx.tar.zst
          if-no-files-found: warn

      - name: Clean build directory
        if: always()
        run: |
          rm -rf build

  cve-check:
    needs: build
    runs-on: ["self-hosted", "linux", "cqfd"]
    strategy:
      fail-fast: false
      matrix:
        cqfd_flavor: ["host_efi", "guest_efi", "observer_efi", "host_standalone_efi"]
    env:
      WORKSPACE: ${{ github.workspace }}/workspace-cve-check
      CACHE_DIR: ${{ github.workspace }}/cache
      SBOM_CVE_CHECK_OUTPUT_FILENAME: sbom-cve-checked.json
      VULNSCOUT_OUTPUT_DIRECTORY: vulnscout-outputs
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}
    steps:
      - name: Create workspace
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p ${{ env.WORKSPACE }}
          mkdir -p ${{ env.CACHE_DIR }}

      - name: Download generated SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-${{ matrix.cqfd_flavor }}
          path: ${{ env.WORKSPACE }}/sbom/

      - name: Setup sbom-cve-check
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install sbom-cve-check

      - name: Run sbom-cve-check
        env:
          SBOM_CVE_CHECK_DATABASES_DIR: "${{ env.CACHE_DIR }}/cve-databases"
        run: |
          sbom_file=$(find ./sbom/ -name '*.rootfs.spdx.tar.zst')
          vex_file=$(find ./sbom/ -name '*.rootfs.json')
          echo Analyzing SBOM $sbom_file and OpenVEX $vex_file.
          # TODO maybe change export filter?
          sbom-cve-check \
            --sbom "$sbom_file" \
            --yocto-vex-manifest "$vex_file" \
            --export-filter-vex-status affected not_affected under_investigation \
            --export-format yocto-cve-check-manifest \
            --export-path ${{ env.SBOM_CVE_CHECK_OUTPUT_FILENAME }}

      - name: Run VulnScout
        env:
          VULNSCOUT_VERSION: latest
          VULNSCOUT_CACHE: ${{ env.CACHE_DIR }}/vulnscout
        run: |
          mkdir ${{ env.VULNSCOUT_CACHE }}
          docker run \
            --rm \
            -v ${{ env.SBOM_CVE_CHECK_OUTPUT_FILENAME }}:/scan/inputs/yocto_cve_check/sbom-cve-checked.json:ro,Z
            -v ${{ env.VULNSCOUT_CACHE }}:/cache/vulnscout:Z
            -v ${{ env.VULNSCOUT_OUTPUT_DIRECTORY }}:/scan/outputs
            -e IGNORE_PARSING_ERRORS=true \
            -e INTERACTIVE_MODE=false \
            -e SKIP_GRYPE_SCAN=true \
            -e FAIL_CONDITION="ignored == false and fixed == false and (cvss >= 9.0 or (cvss >= 7.0 and epss >= 50%))" \
            sflinux/vulnscout:${{ env.VULNSCOUT_VERSION }}

      - name: Upload results
        uses: actions/upload-artifact@v6
        with:
          name: vulnscout-${{ env.CQFD_FLAVOR }}
          path: ${{ env.WORKSPACE }}/${{ env.VULNSCOUT_OUTPUT_DIRECTORY }}
          if-no-files-found: error

      - name: Clean workspace
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ${{ env.WORKSPACE }}
